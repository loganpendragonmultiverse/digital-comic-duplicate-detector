[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-comic-duplicate-detector"
version = "2.0.0"
description = "Find exact and likely duplicate CBZ comics without extracting or modifying archives."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.15,<3", "pip-audit>=2.9,<3", "build>=1.3,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "Pillow>=13.0.0,<14"]
visual = ["Pillow>=13.0.0,<14"]

[project.scripts]
comic-duplicate-detector = "comic_duplicate_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=comic_duplicate_detector --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.data-files]
"share/doc/digital-comic-duplicate-detector" = ["README.md", "DEVELOPMENT.md", "TESTING.md", "CHANGELOG.md"]

"share/doc/digital-comic-duplicate-detector/examples" = ["examples/README.md"]
